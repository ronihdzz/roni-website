services:
  roni-web:
    build:
      context: .
      dockerfile: docker_images/local/Dockerfile
    container_name: roni-web
    ports:
      - "3006:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
